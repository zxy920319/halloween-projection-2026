[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "halloween-skeleton-mirror"
version = "0.1.0"
description = "Pi-to-desktop mock transport for a Halloween skeleton projection"
requires-python = ">=3.11"
dependencies = [
    "Pillow>=10,<13",
    "websockets>=13,<16",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
include = ["shared*", "pi_agent*", "desktop*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
